[workspace]
members = ["crates/core", "crates/provider", "crates/api", "crates/worker"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace.dependencies]
mms-core = { path = "crates/core" }
mms-provider = { path = "crates/provider" }

tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "fs"] }
hyper = "1"

sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"

uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

argon2 = "0.5"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
base64 = "0.22"
rand = "0.8"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
dashmap = "6"
dotenvy = "0.15"
time = "0.3"
phonenumber = "0.3"
